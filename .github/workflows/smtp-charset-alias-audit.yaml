name: SMTP charset alias audit
on:
  push:
    branches: [audit/smtp-charset-aliases-1964]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: '.go-version'
      - name: Prepare backend test assets
        run: make cli-deps-static-sites
      - name: Check formatting and whitespace
        run: |
          test -z "$(gofmt -l server/smtp_server.go server/smtp_charset_test.go)"
          git diff --check HEAD^
      - name: Run SMTP regressions with race detection
        run: go test -mod=readonly -race ./server -run '^(TestReadMailBody_Charset|TestSmtpBackend_)' -count=1 -timeout=5m -v
      - name: Vet server
        run: go vet ./server
      - name: Fuzz charset parser
        run: go test ./server -run '^$' -fuzz '^FuzzReadMailBodyCharset$' -fuzztime=60s
